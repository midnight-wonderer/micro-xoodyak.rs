[package]
name = "micro-xoodyak"
version = "0.0.1"
authors = ["Sarun Rattanasiri"]
edition = "2024"
description = "A lightweight, zero-allocation implementation of the Xoodyak cryptographic scheme, optimized for 32-bit microcontrollers (ARM Cortex-M, RISC-V)."
readme = "README.md"
keywords = ["xoodyak", "embedded", "cortex-m", "riscv", "aead"]
license = "MIT"
homepage = "https://github.com/midnight-wonderer/micro-xoodyak"
repository = "https://github.com/midnight-wonderer/micro-xoodyak"
categories = ["embedded", "cryptography", "no-std", "no-std::no-alloc"]

[features]
default = []
alloc = ["zeroize/alloc"]

[dependencies]
zeroize = { version = "1.8", default-features = false }

[dev-dependencies]
benchmark-simple = "0.1.10"

[profile.release]
codegen-units = 1
incremental = false
panic = "abort"
lto = "fat"

[profile.bench]
codegen-units = 1

[[bench]]
name = "benchmark"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

